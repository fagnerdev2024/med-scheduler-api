<div class="page-header">
  <h1>Pacientes</h1>
  <button mat-raised-button color="primary" routerLink="/pacientes/novo">
    <mat-icon>add</mat-icon> Novo paciente
  </button>
</div>

<mat-form-field appearance="outline" class="filter-field">
  <mat-label>Buscar</mat-label>
  <input matInput [formControl]="filtro" placeholder="Nome, email ou CPF" />
</mat-form-field>

@if (loading) {
  <div class="loading"><mat-spinner diameter="40"></mat-spinner></div>
} @else {
  <mat-card>
    <table mat-table [dataSource]="dataSource" class="full-width">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.email }}</td>
      </ng-container>

      <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef>CPF</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.cpf }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef class="actions-column">Ações</th>
        <td mat-cell *matCellDef="let paciente" class="actions-column">
          <button mat-icon-button color="primary" [routerLink]="['/pacientes', paciente.id, 'editar']" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="excluir(paciente.id)" title="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="page?.totalElements || 0"
                   [pageIndex]="pageIndex"
                   [pageSize]="pageSize"
                   [pageSizeOptions]="[5, 10, 25, 50]"
                   (page)="onPageChange($event)">
    </mat-paginator>
  </mat-card>
}
