<div class="page-header">
  <h1>{{ pacienteId ? 'Editar' : 'Novo' }} Paciente</h1>
  <button mat-stroked-button routerLink="/pacientes">Voltar</button>
</div>

@if (loading) {
  <div class="loading"><mat-spinner diameter="48"></mat-spinner></div>
} @else {
  <mat-card>
    <form [formGroup]="pacienteForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <mat-form-field appearance="outline" class="flex-grow">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="flex-grow">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="flex-grow">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="flex-grow">
          <mat-label>CPF</mat-label>
          <input matInput formControlName="cpf" />
          <mat-hint>Formato: 000.000.000-00 ou somente números</mat-hint>
        </mat-form-field>
      </div>

      <h3>Endereço</h3>
      <div formGroupName="endereco">
        <div class="form-row">
          <mat-form-field appearance="outline" class="flex-grow-3">
            <mat-label>Logradouro</mat-label>
            <input matInput formControlName="logradouro" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-grow-1">
            <mat-label>Número</mat-label>
            <input matInput formControlName="numero" />
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="flex-grow">
            <mat-label>Complemento</mat-label>
            <input matInput formControlName="complemento" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-grow">
            <mat-label>Bairro</mat-label>
            <input matInput formControlName="bairro" />
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="flex-grow">
            <mat-label>CEP</mat-label>
            <input matInput formControlName="cep" />
            <mat-hint>Apenas 8 números</mat-hint>
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-grow">
            <mat-label>Cidade</mat-label>
            <input matInput formControlName="cidade" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="uf-field">
            <mat-label>UF</mat-label>
            <input matInput formControlName="uf" maxlength="2" />
          </mat-form-field>
        </div>
      </div>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="salvando">
          @if (salvando) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Salvar
          }
        </button>
        <button mat-stroked-button type="button" routerLink="/pacientes" [disabled]="salvando">Cancelar</button>
      </div>
    </form>
  </mat-card>
}
