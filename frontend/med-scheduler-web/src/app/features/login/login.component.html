<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Med Scheduler</mat-card-title>
      <mat-card-subtitle>Entre com suas credenciais</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="login" type="email" placeholder="seu@email.com" />
          @if (loginForm.get('login')?.invalid && loginForm.get('login')?.touched) {
            <mat-error>Email inválido</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput formControlName="senha" type="password" />
          @if (loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched) {
            <mat-error>Senha obrigatória</mat-error>
          }
        </mat-form-field>

        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loading">
          @if (loading) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Entrar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
